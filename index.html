<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://*.firebaseapp.com https://*.firebaseio.com https://www.gstatic.com; frame-src 'self'; connect-src 'self' https://*.firebaseapp.com https://*.firebaseio.com https://*.googleapis.com; img-src 'self' data: https:;">
    
    <title>Brainy Wallet - Application</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- RESET ET STRUCTURE DE BASE --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
        }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f6ff;
        }

        /* --- ZONE DE CONTENU (IFRAME) --- */
        #app-frame {
            width: 100%;
            height: calc(100% - 65px);
            border: none;
            display: block;
            background-color: #f0f6ff;
        }

        /* --- BARRE DE NAVIGATION EN BAS --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px; 
            background: #ffffff;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            padding-bottom: env(safe-area-inset-bottom); 
        }

        /* --- BOUTONS DE NAVIGATION --- */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8a92b2;
            cursor: pointer;
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
            user-select: none; 
        }

        .nav-item i {
            font-size: 22px;
            margin-bottom: 4px;
            transition: transform 0.2s ease, color 0.3s ease;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 600;
        }

        /* --- ÉTAT ACTIF (Page sélectionnée) --- */
        .nav-item.active {
            color: #007bff;
        }

        .nav-item.active i {
            transform: translateY(-2px) scale(1.1); 
            color: #007bff;
        }

    </style>
</head>
<body>
    <iframe id="app-frame"></iframe>

    <nav class="bottom-nav">
        
        <div class="nav-item active" data-pid="k_h1x9">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        
        <div class="nav-item" data-pid="k_a2y8">
            <i class="fa-solid fa-chart-line"></i>
            <span>Deals</span>
        </div>
        
		 <div class="nav-item" data-pid="k_s3z7">
            <i class="fa-solid fa-store"></i>
            <span>Store</span>
        </div>
		
        <div class="nav-item" data-pid="k_t4w6">
            <i class="fa-solid fa-chart-candlestick"></i>
            <span>Trade </span>
        </div>
        
        <div class="nav-item" data-pid="k_c5v5">
            <i class="fa-solid fa-rocket"></i>
            <span>Rush </span>
        </div>
        
        <div class="nav-item" data-pid="k_j6u4">
            <i class="fa-solid fa-gift"></i>
            <span>Tirage</span>
        </div>
    </nav>

    <script>
       
        (function() {
            'use strict';

            const _r = {
                'k_h1x9': '6163637565696c2e68746d6c', 
                'k_a2y8': '616374696f6e2e68746d6c', 
                'k_s3z7': '626f7574697175652e68746d6c',
                'k_t4w6': '74726164696e672e68746d6c',
                'k_c5v5': '63726173682e68746d6c', 
                'k_j6u4': '6a65752e68746d6c' 
            };

   
            const _dH = (h) => {
                let s = '';
                for (let i = 0; i < h.length; i += 2) {
                    s += String.fromCharCode(parseInt(h.substr(i, 2), 16));
                }
                return s;
            };

      
            const _allowedList = Object.values(_r).map(h => _dH(h));

     
            const _nodeMap = new WeakMap();
            let _suspiciousActivity = 0;

            function initNav() {
                const navItems = document.querySelectorAll('.nav-item');
                const iframe = document.getElementById('app-frame');

   
                iframe.src = _dH(_r['k_h1x9']);

                navItems.forEach(item => {
                    const pid = item.getAttribute('data-pid');
                    if (pid && _r[pid]) {
           
                        _nodeMap.set(item, pid);
                        
              
                        item.addEventListener('click', function(e) {
                            e.preventDefault();
                            _processNav(this, iframe);
                        });
                    }
                });
            }

            function _processNav(element, iframe) {
                const currentPid = element.getAttribute('data-pid');
                const originalPid = _nodeMap.get(element);

            
                if (!originalPid || currentPid !== originalPid) {
                    _flag("Modification structurelle détectée");
                    return;
                }

                const encodedDest = _r[originalPid];
                if (!encodedDest) {
                    _flag("Identifiant de route invalide");
                    return;
                }

                const dest = _dH(encodedDest);

           
                if (!_isSafe(dest)) {
                    _flag("Tentative de navigation hors liste blanche");
                    return;
                }

           
                iframe.src = dest;

        
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                element.classList.add('active');
            }

            function _isSafe(dest) {
            
                if (!_allowedList.includes(dest)) return false;
                
           
                const forbiddenProtocols = /^(http|https|javascript|data|vbscript|file):/i;
                const pathTraversal = /(\.\.\/|\.\/)/;
                
                if (forbiddenProtocols.test(dest) || pathTraversal.test(dest)) return false;

                return true;
            }

            function _flag(reason) {
                _suspiciousActivity++;
                console.warn("[Système Sécurisé] Action ignorée : " + reason);
                
                if (_suspiciousActivity >= 3) {
                    alert("Alerte de sécurité : Activité anormale de navigation détectée. L'action a été bloquée.");
                    _suspiciousActivity = 0; 
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initNav);
            } else {
                initNav();
            }

        })();
    </script>

</body>
</html>
